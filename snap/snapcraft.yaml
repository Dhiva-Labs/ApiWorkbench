# Snap Store packaging for ApiWorkbench.
#
# Same pattern as BranchPilot and Mock Studio: `plugin: flutter` + the
# `gnome` extension under strict confinement, built from source in a core22
# container so the binary matches the snap's runtime libraries.
#
#   snapcraft --use-lxd
#   snapcraft upload --release=stable apiworkbench_<version>_<amd64|arm64>.snap
#
# Snapcraft builds for the architecture of the machine it runs on: amd64 on an
# x86-64 host, arm64 on an ARM64 host. The Desktop builds workflow builds both.
name: apiworkbench
title: ApiWorkbench
base: core22
version: '1.4.0'
summary: API client for building, testing and load testing HTTP requests
description: |
  ApiWorkbench is a fast, keyboard-friendly API client in the spirit of
  Postman.

  - Request tabs and a full request builder: every HTTP method including
    QUERY, path variables, params, headers, bulk edit, JSON / XML / form /
    multipart / file / GraphQL bodies
  - Auth: Bearer, Basic, API key, OAuth 2.0 (browser sign-in, refresh),
    OAuth 1.0, Digest, NTLM, AWS Signature v4, Hawk, Akamai EdgeGrid and
    JWT, inherited from folders and collections
  - Pre-request and test scripts with Postman's pm API (chai, lodash,
    crypto-js, moment, pm.sendRequest, visualizer)
  - Environments, Globals, collection variables, initial and current
    values, secret variables
  - Cookie jar and manager, a Console of every request on the wire, proxy
    and client certificate (mTLS) settings, per-request settings
  - WebSocket, Socket.IO, MQTT, Server-Sent Events and gRPC (reflection
    or .proto files) requests
  - GraphQL schema explorer with field suggestions
  - Response preview (HTML, images, SVG, PDF), find in body, save to file,
    saved examples
  - Postman import and export, OpenAPI / Swagger import and export, HAR
    import, workspace import and export
  - Code snippets in 19 languages and cURL import
  - Collection runner with CSV and JSON data files, and the apiworkbench.cli
    command-line runner with JUnit and HTML reports
  - Load testing with up to 1,000 parallel users, live p50/p95/p99 latency
    and HTML, CSV or JSON reports
  - Collection docs (HTML or Markdown) and local version history
  - HTTP/1.1, HTTP/2 and HTTP/3, self-signed certificate support
  - Teal light/dark and Graphite and orange themes, hover help on every
    field, a phone-friendly layout
  - Chaos Mode: a sound per status code, confetti and screen shake

  A Dhiva Labs project.

grade: stable
confinement: strict
icon: snap/gui/apiworkbench.png
license: MIT
website: https://github.com/Dhiva-Labs/ApiWorkbench
source-code: https://github.com/Dhiva-Labs/ApiWorkbench
issues: https://github.com/Dhiva-Labs/ApiWorkbench/issues
contact: dhivakar1010@gmail.com

architectures:
  - build-on: [amd64]
  - build-on: [arm64]

apps:
  apiworkbench:
    command: apiworkbench
    extensions:
      - gnome
    desktop: usr/share/applications/apiworkbench.desktop
    plugs:
      - home
      - removable-media
      - network
      - network-bind
      # Chaos Mode plays sounds through the bundled gst-play-1.0.
      - audio-playback

  # The command-line runner: `snap run apiworkbench.cli run <file>`. A
  # confined app reads files under the home folder and removable media only.
  cli:
    command: apiworkbench-cli
    plugs:
      - home
      - removable-media
      - network

parts:
  apiworkbench:
    plugin: flutter
    source: .
    flutter-target: lib/main.dart
    # A build/ left by a host-side `flutter build linux` carries a
    # CMakeCache.txt naming host paths, which CMake refuses to reuse.
    override-pull: |
      craftctl default
      rm -rf build .dart_tool .flutter .pub-cache dist parts prime stage \
        linux/flutter/ephemeral linux/packaging/snap/bundle test_artifacts
    # The plugin builds the app and puts the Flutter SDK on PATH; compile
    # the command-line runner with that SDK's dart and add it to the snap.
    override-build: |
      craftctl default
      tool/build_cli.sh "$CRAFT_PART_BUILD/build/cli/snap"
      . tool/cli_bundle.sh
      install_cli "$CRAFT_PART_BUILD/build/cli/snap" "$CRAFT_PART_INSTALL"
    build-packages:
      - clang
      - cmake
      - ninja-build
      - pkg-config
      - libgtk-3-dev
      - liblzma-dev
      - curl
      - unzip
      - xz-utils
      - git
    stage-packages:
      - libgtk-3-0
      # A confined app cannot run the host's audio players, so Chaos Mode's
      # player ships inside the snap. SoundService looks for gst-play-1.0
      # first; on core22 that binary is in plugins-base-apps, not tools.
      # plugins-good decodes the bundled mp3 and wav clips.
      - gstreamer1.0-plugins-base-apps
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - gstreamer1.0-pulseaudio

  desktop-assets:
    plugin: dump
    source: snap/gui
    organize:
      apiworkbench.desktop: usr/share/applications/apiworkbench.desktop
      apiworkbench.png: usr/share/icons/hicolor/256x256/apps/apiworkbench.png
    stage:
      - usr/share/applications/apiworkbench.desktop
      - usr/share/icons/hicolor/256x256/apps/apiworkbench.png
