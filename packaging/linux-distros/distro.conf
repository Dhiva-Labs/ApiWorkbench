# Package metadata for the other-distribution packages (.rpm, Arch, AppImage,
# AUR PKGBUILD). Sourced by bash from packaging/linux-distros/pack.sh,
# verify.sh and packaging/arch/aur.sh. Keep it in step with the .deb
# (tool/build_deb.sh).

NAME=apiworkbench            # package name, the same as the .deb's
APP_NAME=ApiWorkbench        # AppImage file name and display name
GITHUB_REPO=Dhiva-Labs/ApiWorkbench
TAG_PREFIX=v                 # release tags are v1.2.3
SUMMARY='Cross-platform API client for building and testing HTTP requests'
DESCRIPTION='Postman-style workbench with request collections and folders, environments and collection variables, Postman import, response assertions and captures, a collection runner, and load testing with call logs and HTML/CSV/JSON reports. Includes apiworkbench-cli, which runs a collection from the command line for CI.'
MAINTAINER='Dhivakar R <dhivakar1010@gmail.com>'
HOMEPAGE=https://github.com/Dhiva-Labs/ApiWorkbench
LICENSE=MIT                  # SPDX id
# The repository has no LICENSE file; the Debian copyright file carries the
# copyright line and the MIT text.
LICENSE_FILE=linux/packaging/debian/copyright

# Files of the .deb tree that the other formats leave out. libdartjni.so
# comes from the jni plugin (an Android dependency); CMake builds it only
# because the CI runner has a JDK, and it links that runner's libjvm.so by
# absolute path. Nothing loads it on desktop Linux (the snap, built without
# a JDK, has no such file), and shipping it would make the rpm require a JVM.
EXCLUDE=(usr/lib/apiworkbench/lib/libdartjni.so)

# rpm: shared-library dependencies are worked out from the ELF files. The
# Flutter engine also dlopens EGL and GLES 2 (libepoxy), which no ELF file
# lists, and aborts without them, so they are named here as rpm soname
# capabilities. The tools the app can run are optional (curl for HTTP/3, an
# audio player for Chaos Mode) and the UI says when they are missing.
RPM_REQUIRES=('libEGL.so.1()(64bit)' 'libGLESv2.so.2()(64bit)')
# Arch: package names, written by hand (Arch has no soname dependencies for
# most libraries). CI's ldd check on archlinux:latest keeps this honest;
# libglvnd is the dlopened EGL/GLES 2.
ARCH_DEPENDS=(gtk3 libglvnd)
ARCH_INDEPENDENT=0

# AppImage (GUI apps): paths relative to the installed tree.
APPIMAGE=1
EXEC=usr/lib/apiworkbench/apiworkbench
DESKTOP=usr/share/applications/apiworkbench.desktop
ICON=usr/share/icons/hicolor/256x256/apps/apiworkbench.png
APPRUN_ENV=''                # /usr/bin/apiworkbench is a plain link
# Host libraries the AppImage relies on besides GTK 3 (Fedora names,
# installed for the AppImage check): EGL and GLES 2, which every desktop
# has but a minimal container does not.
APPIMAGE_HOST_PKGS='libglvnd-egl libglvnd-gles'

# Smoke tests run in each distribution container by verify.sh.
GUI_CMD=apiworkbench         # must still be running after SMOKE_SECONDS under Xvfb
SMOKE_SECONDS=20
# The same proof as the .deb smoke run: the native runner's window title,
# and the data folder Dart start-up creates through path_provider
# (<data home>/<app id>/apiworkbench, a `find -path` pattern under $HOME),
# which shows the AOT snapshot ran.
SMOKE_WINDOW='^ApiWorkbench$'
SMOKE_DATA_PATH='.local/share/*/apiworkbench'
# The command-line runner, in the packages (the AppImage starts the GUI).
SMOKE_CMD='apiworkbench-cli --version && apiworkbench-cli --help'
