name: Desktop builds

# Builds, tests and packages ApiWorkbench for Linux and Windows on x64 and
# arm64, plus a snap for both Linux architectures. The Linux .deb is then
# repackaged as .rpm (Fedora, RHEL, openSUSE), Arch package, AppImage and
# Flatpak, and an AUR PKGBUILD, each installed and run on its distribution.
# Every package also holds apiworkbench-cli, the command-line runner, which
# is smoke-tested against a local server (tool/cli_smoke.dart). Releases are
# made by hand; when one is published, the packages it lacks are attached.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            deb_arch: amd64
            runner: ubuntu-24.04
            elf_machine: x86-64
          - arch: arm64
            deb_arch: arm64
            runner: ubuntu-24.04-arm
            elf_machine: ARM aarch64
    env:
      BUNDLE: build/linux/${{ matrix.arch }}/release/bundle
      ELF_MACHINE: ${{ matrix.elf_machine }}
    steps:
      - uses: actions/checkout@v7

      # There are no Flutter SDK archives for linux-arm64, so the release tag
      # is cloned; every leg uses the same method.
      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Configure Flutter
        run: |
          uname -m
          flutter config --no-analytics --enable-linux-desktop
          flutter precache --linux
          flutter --version
          dart --version

      # xvfb, xauth, xdotool, dbus-x11: the smoke run of the installed .deb.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            file xvfb xauth xdotool dbus-x11

      - name: Get packages
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Build release
        run: flutter build linux --release

      - name: Assert every ELF file in the bundle is ${{ matrix.elf_machine }}
        run: |
          for f in apiworkbench lib/libapp.so lib/libflutter_linux_gtk.so; do
            [ -f "$BUNDLE/$f" ] || { echo "::error::missing $BUNDLE/$f"; exit 1; }
          done
          checked=0
          bad=0
          while IFS= read -r -d '' f; do
            desc="$(file -b "$f")"
            case "$desc" in ELF*) ;; *) continue ;; esac
            echo "$f: $desc"
            checked=$((checked + 1))
            case "$desc" in
              *"$ELF_MACHINE"*) ;;
              *) echo "::error file=$f::not $ELF_MACHINE"; bad=1 ;;
            esac
          done < <(find "$BUNDLE" -type f -print0)
          echo "checked $checked ELF files"
          [ "$checked" -ge 3 ] && [ "$bad" -eq 0 ]

      # `dart build cli`, not `dart compile exe`: some of the app's packages
      # have Dart build hooks, which compile exe refuses to run.
      - name: Build the command-line runner
        run: tool/build_cli.sh

      - name: Assert the command-line runner is ${{ matrix.elf_machine }}
        run: file build/cli/${{ matrix.arch }}/bin/apiworkbench-cli | grep "$ELF_MACHINE"

      - name: Smoke-run the command-line runner against a local server
        run: dart tool/cli_smoke.dart build/cli/${{ matrix.arch }}/bin/apiworkbench-cli

      - name: Package tarball and .deb
        run: |
          tool/build_tarball.sh dist
          tool/build_deb.sh

      - name: Check the packages
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          TARBALL="dist/ApiWorkbench-${VERSION}-linux-${{ matrix.arch }}.tar.gz"
          DEB="dist/apiworkbench_${VERSION}_${{ matrix.deb_arch }}.deb"
          ls -l dist
          [ -f "$TARBALL" ] && [ -f "$DEB" ] && [ -f "$DEB.sha256" ]
          (cd dist && sha256sum -c "$(basename "$DEB").sha256")
          tar -xzf "$TARBALL" -C "$RUNNER_TEMP"
          file "$RUNNER_TEMP/ApiWorkbench-${VERSION}-linux-${{ matrix.arch }}/apiworkbench" | grep "$ELF_MACHINE"
          # -L: the CLI is a link to bin/ when it ships native libraries.
          file -L "$RUNNER_TEMP/ApiWorkbench-${VERSION}-linux-${{ matrix.arch }}/apiworkbench-cli" | grep "$ELF_MACHINE"
          dart tool/cli_smoke.dart "$RUNNER_TEMP/ApiWorkbench-${VERSION}-linux-${{ matrix.arch }}/apiworkbench-cli"
          dpkg-deb --info "$DEB"
          [ "$(dpkg-deb --field "$DEB" Architecture)" = "${{ matrix.deb_arch }}" ]
          sudo apt-get install -y "./$DEB"
          file /usr/lib/apiworkbench/apiworkbench | grep "$ELF_MACHINE"
          file -L /usr/lib/apiworkbench/apiworkbench-cli | grep "$ELF_MACHINE"
          [ "$(readlink /usr/bin/apiworkbench-cli)" = ../lib/apiworkbench/apiworkbench-cli ]
          apiworkbench-cli --version
          dart tool/cli_smoke.dart /usr/bin/apiworkbench-cli

      # The native GTK runner titles the window "ApiWorkbench". Dart start-up
      # creates the data folder <data home>/<app id>/apiworkbench through
      # path_provider, which is what shows that the AOT snapshot really ran.
      - name: Smoke-run the installed app (Xvfb)
        timeout-minutes: 5
        run: |
          cat > "$RUNNER_TEMP/smoke.sh" <<'EOF'
          export XDG_DATA_HOME="$RUNNER_TEMP/smoke-data"
          rm -rf "$XDG_DATA_HOME"
          mkdir -p "$XDG_DATA_HOME"
          log="$RUNNER_TEMP/smoke.log"
          apiworkbench > "$log" 2>&1 &
          pid=$!
          for i in $(seq 1 90); do
            if xdotool search --name '^ApiWorkbench$' > /dev/null 2>&1 &&
               [ -n "$(find "$XDG_DATA_HOME" -mindepth 2 -maxdepth 2 -type d -name apiworkbench)" ]; then
              echo "ApiWorkbench window is up after ${i}s; data folder:"
              find "$XDG_DATA_HOME" -maxdepth 2
              sleep 5
              kill -0 "$pid" || { echo "apiworkbench died after showing its window"; cat "$log"; exit 1; }
              kill "$pid"
              cat "$log"
              exit 0
            fi
            kill -0 "$pid" 2> /dev/null || { echo "apiworkbench exited early"; cat "$log"; exit 1; }
            sleep 1
          done
          echo "no ApiWorkbench window and data folder after 90s"
          find "$XDG_DATA_HOME" -maxdepth 3
          cat "$log"
          exit 1
          EOF
          xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- bash "$RUNNER_TEMP/smoke.sh"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            pe_machine: '0x8664'
            elf_machine: '0x3E'
          - arch: arm64
            runner: windows-11-arm
            pe_machine: '0xAA64'
            elf_machine: '0xB7'
    defaults:
      run:
        shell: pwsh
    env:
      ARCH: ${{ matrix.arch }}
      RELEASE_DIR: build\windows\${{ matrix.arch }}\runner\Release
      # PE COFF machine of every .exe/.dll, and ELF e_machine of the AOT
      # snapshot (data\app.so is an ELF file on Windows too).
      PE_MACHINE: ${{ matrix.pe_machine }}
      ELF_MACHINE: ${{ matrix.elf_machine }}
    steps:
      - uses: actions/checkout@v7

      # On an ARM64 host (PROCESSOR_ARCHITECTURE=ARM64) the bootstrap fetches
      # the arm64 Dart SDK and `flutter build windows` targets windows-arm64.
      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git clone --depth 1 --branch $env:FLUTTER_VERSION `
            https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\flutter\bin"

      - name: Configure Flutter
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          flutter config --no-analytics --enable-windows-desktop
          flutter precache --windows
          flutter --version
          dart --version

      - name: Get packages
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Build release
        run: flutter build windows --release

      - name: Assert every PE file is ${{ matrix.pe_machine }}
        run: |
          function Get-PeMachine([string]$Path) {
            $fs = [IO.File]::OpenRead($Path)
            try {
              $br = New-Object IO.BinaryReader($fs)
              $fs.Position = 0x3C
              $fs.Position = $br.ReadInt32()
              if ($br.ReadUInt32() -ne 0x4550) { throw "$Path is not a PE file" }
              return $br.ReadUInt16()
            } finally { $fs.Dispose() }
          }
          $expected = [Convert]::ToUInt16($env:PE_MACHINE, 16)
          $files = Get-ChildItem -Path $env:RELEASE_DIR -Recurse -File -Include *.exe, *.dll
          if (-not ($files.Name -contains 'apiworkbench.exe') -or -not ($files.Name -contains 'flutter_windows.dll')) {
            throw "apiworkbench.exe or flutter_windows.dll missing from $env:RELEASE_DIR"
          }
          $bad = 0
          foreach ($f in $files) {
            $m = Get-PeMachine $f.FullName
            '{0,-50} 0x{1:X4}' -f $f.Name, $m
            if ($m -ne $expected) { Write-Host "::error file=$($f.FullName)::machine 0x$('{0:X4}' -f $m), expected $env:PE_MACHINE"; $bad++ }
          }
          $bytes = [IO.File]::ReadAllBytes("$env:RELEASE_DIR\data\app.so")
          $elf = [BitConverter]::ToUInt16($bytes, 0x12)
          'data\app.so ELF e_machine 0x{0:X2}' -f $elf
          if ($elf -ne [Convert]::ToUInt16($env:ELF_MACHINE, 16)) { Write-Host "::error::app.so is not $env:ELF_MACHINE"; $bad++ }
          "checked $($files.Count) PE files and app.so"
          if ($bad) { exit 1 }

      # `dart build cli`, not `dart compile exe`: some of the app's packages
      # have Dart build hooks, which compile exe refuses to run.
      - name: Build the command-line runner
        run: ./tool/build_cli.ps1

      - name: Assert the command-line runner is ${{ matrix.pe_machine }}
        run: |
          $fs = [IO.File]::OpenRead("build\cli\$env:ARCH\bin\apiworkbench-cli.exe")
          try {
            $br = New-Object IO.BinaryReader($fs)
            $fs.Position = 0x3C
            $fs.Position = $br.ReadInt32()
            if ($br.ReadUInt32() -ne 0x4550) { throw 'apiworkbench-cli.exe is not a PE file' }
            $m = $br.ReadUInt16()
          } finally { $fs.Dispose() }
          'apiworkbench-cli.exe machine 0x{0:X4}' -f $m
          if ($m -ne [Convert]::ToUInt16($env:PE_MACHINE, 16)) { throw "apiworkbench-cli.exe is not $env:PE_MACHINE" }

      - name: Smoke-run the command-line runner against a local server
        run: dart tool/cli_smoke.dart "build\cli\$env:ARCH\bin\apiworkbench-cli.exe"

      # Dart start-up creates %APPDATA%\<CompanyName>\<ProductName>\apiworkbench
      # (path_provider, names from windows\runner\Runner.rc), which shows that
      # the AOT snapshot really ran.
      - name: Smoke-run the release build
        timeout-minutes: 5
        run: |
          $dataRoot = Join-Path $env:APPDATA 'Dhiva Labs\ApiWorkbench'
          $dataDir = Join-Path $dataRoot 'apiworkbench'
          if (Test-Path $dataRoot) { Remove-Item -Recurse -Force $dataRoot }
          $p = Start-Process -FilePath "$env:RELEASE_DIR\apiworkbench.exe" -PassThru
          $up = $false
          for ($i = 1; $i -le 90; $i++) {
            Start-Sleep -Seconds 1
            $p.Refresh()
            if ($p.HasExited) { throw "apiworkbench.exe exited early with code $($p.ExitCode)" }
            if ($p.MainWindowHandle -ne 0 -and (Test-Path $dataDir)) {
              "window '$($p.MainWindowTitle)' is up after ${i}s; data folder $dataDir exists"
              $up = $true
              break
            }
          }
          if (-not $up) {
            Stop-Process -Id $p.Id -Force
            throw "no window or data folder after 90 s (window handle $($p.MainWindowHandle), data folder exists: $(Test-Path $dataDir))"
          }
          Start-Sleep -Seconds 5
          $p.Refresh()
          if ($p.HasExited) { throw "apiworkbench.exe died after showing its window (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force

      # Zip first, then the Store package: tool\build_store_msix.ps1 rebuilds
      # the app without the meme clips, which replaces the Release folder.
      - name: Package zip and MSIX
        run: ./tool/package_windows.ps1 -OutDir dist

      - name: Check the packages
        run: |
          function Get-PeMachine([string]$Path) {
            $fs = [IO.File]::OpenRead($Path)
            try {
              $br = New-Object IO.BinaryReader($fs)
              $fs.Position = 0x3C
              $fs.Position = $br.ReadInt32()
              if ($br.ReadUInt32() -ne 0x4550) { throw "$Path is not a PE file" }
              return $br.ReadUInt16()
            } finally { $fs.Dispose() }
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $expected = [Convert]::ToUInt16($env:PE_MACHINE, 16)
          $version = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value -split '\+')[0]
          $zipName = "ApiWorkbench-$version-windows-$env:ARCH"
          $msixName = if ($env:ARCH -eq 'x64') { 'ApiWorkbench' } else { "ApiWorkbench-$env:ARCH" }
          Get-ChildItem dist | Format-Table Name, Length
          if ((Get-ChildItem dist).Count -ne 2) { throw 'expected exactly one zip and one msix in dist' }

          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path "dist\$zipName.zip"))
          try {
            $entry = $zip.GetEntry("$zipName/apiworkbench.exe")
            if (-not $entry) { throw "$zipName/apiworkbench.exe not in the zip" }
            $tmp = Join-Path $env:RUNNER_TEMP 'zip_apiworkbench.exe'
            [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $tmp, $true)
            $m = Get-PeMachine $tmp
            $memes = @($zip.Entries | Where-Object { $_.Name -like 'meme_*' }).Count
            'zip: {0} entries, {1} meme clips, apiworkbench.exe 0x{2:X4}' -f $zip.Entries.Count, $memes, $m
            if ($m -ne $expected) { throw 'zip holds the wrong architecture' }
          } finally { $zip.Dispose() }

          # The command-line runner: apiworkbench-cli.exe next to the app, or
          # (with native libraries) bin\ + lib\ and an apiworkbench-cli.cmd.
          $extract = Join-Path $env:RUNNER_TEMP 'zip_extract'
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          [IO.Compression.ZipFile]::ExtractToDirectory((Resolve-Path "dist\$zipName.zip").Path, $extract)
          $app = Join-Path $extract $zipName
          $cli = Join-Path $app 'apiworkbench-cli.exe'
          if (-not (Test-Path $cli)) { $cli = Join-Path $app 'apiworkbench-cli.cmd' }
          if (-not (Test-Path $cli)) { throw 'apiworkbench-cli is not in the zip' }
          $cliExe = Get-ChildItem $app -Recurse -Filter apiworkbench-cli.exe | Select-Object -First 1
          if (-not $cliExe) { throw 'apiworkbench-cli.exe is not in the zip' }
          $m = Get-PeMachine $cliExe.FullName
          'zip: {0} 0x{1:X4}' -f $cliExe.FullName.Substring($extract.Length), $m
          if ($m -ne $expected) { throw 'zip holds the wrong architecture of apiworkbench-cli.exe' }
          dart tool/cli_smoke.dart $cli
          if ($LASTEXITCODE -ne 0) { throw 'the packaged apiworkbench-cli failed its smoke test' }

          $msix = [IO.Compression.ZipFile]::OpenRead((Resolve-Path "dist\$msixName.msix"))
          try {
            $reader = New-Object IO.StreamReader($msix.GetEntry('AppxManifest.xml').Open())
            $manifest = [xml]$reader.ReadToEnd()
            $reader.Dispose()
            $id = $manifest.Package.Identity
            "msix identity: Name=$($id.Name) Version=$($id.Version) ProcessorArchitecture=$($id.ProcessorArchitecture) Publisher=$($id.Publisher)"
            if ($id.ProcessorArchitecture -ne $env:ARCH) { throw "msix ProcessorArchitecture is $($id.ProcessorArchitecture)" }
            if ($id.Name -ne 'Dhiva-Labs.ApiWorkbench') { throw "msix identity is $($id.Name)" }
            if ($id.Publisher -ne 'CN=0F69015A-AA5B-431D-970A-165099309E53') { throw "msix publisher is $($id.Publisher)" }
            # The Store package must not carry the third-party meme clips.
            $memes = @($msix.Entries | Where-Object { $_.Name -like 'meme_*' })
            if ($memes.Count -gt 0) { throw "msix still holds $($memes.Count) meme clips" }
            $tmp = Join-Path $env:RUNNER_TEMP 'msix_apiworkbench.exe'
            [IO.Compression.ZipFileExtensions]::ExtractToFile($msix.GetEntry('apiworkbench.exe'), $tmp, $true)
            $m = Get-PeMachine $tmp
            'msix: {0} entries, no meme clips, apiworkbench.exe 0x{1:X4}' -f $msix.Entries.Count, $m
            if ($m -ne $expected) { throw 'msix holds the wrong architecture' }
          } finally { $msix.Dispose() }

      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.msix
          if-no-files-found: error

  snap:
    name: Snap ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            elf_machine: x86-64
          - arch: arm64
            runner: ubuntu-24.04-arm
            elf_machine: ARM aarch64
    steps:
      - uses: actions/checkout@v7

      - uses: snapcore/action-build@v1
        id: build

      # The binary, the engine and the bundled gst-play-1.0 (Chaos Mode) must
      # all be of the snap's architecture.
      - name: Assert the snap is ${{ matrix.arch }}
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
          ELF_MACHINE: ${{ matrix.elf_machine }}
        run: |
          ls -l "$SNAP_FILE"
          case "$SNAP_FILE" in
            *_${{ matrix.arch }}.snap) ;;
            *) echo "::error::unexpected snap file name $SNAP_FILE"; exit 1 ;;
          esac
          command -v unsquashfs > /dev/null || sudo apt-get install -y squashfs-tools
          unsquashfs -q -d "$RUNNER_TEMP/snap" "$SNAP_FILE" meta/snap.yaml apiworkbench lib usr/bin/gst-play-1.0
          # The command-line runner is a file, or a link to bin/ when it
          # ships native libraries.
          unsquashfs -ll "$SNAP_FILE" | grep -E 'squashfs-root/apiworkbench-cli( |$)'
          grep -q 'command: apiworkbench-cli' "$RUNNER_TEMP/snap/meta/snap.yaml"
          sed -n '/^architectures:/,/^[a-z]/p' "$RUNNER_TEMP/snap/meta/snap.yaml"
          grep -qx -- '- ${{ matrix.arch }}' "$RUNNER_TEMP/snap/meta/snap.yaml"
          checked=0
          for f in apiworkbench usr/bin/gst-play-1.0 lib/libapp.so lib/libflutter_linux_gtk.so; do
            [ -f "$RUNNER_TEMP/snap/$f" ] || { echo "::error::missing $f in the snap"; exit 1; }
            file "$RUNNER_TEMP/snap/$f" | tee /dev/stderr | grep -q "$ELF_MACHINE"
            checked=$((checked + 1))
          done
          echo "checked $checked ELF files"

      # Installs the snap the way the Store does (strict, no --devmode) with
      # the gnome content snap it plugs, and starts it on this architecture.
      # Xvfb runs without access control because a confined app cannot read
      # xvfb-run's Xauthority file in /tmp. `snap run` is not wrapped in
      # dbus-run-session: it needs the runner's own systemd to track the app.
      - name: Install the snap confined and start it (Xvfb)
        timeout-minutes: 10
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
        run: |
          sudo apt-get install -y xvfb xdotool
          sudo snap install gnome-42-2204
          sudo snap install --dangerous "$SNAP_FILE"
          snap list apiworkbench
          grep -x 'confinement: strict' /snap/apiworkbench/current/meta/snap.yaml
          snap connections apiworkbench

          # Chaos Mode plays sounds with the gst-play-1.0 that ships in the snap.
          snap run --shell apiworkbench -c 'gst-play-1.0 --version'

          # The command-line runner app, confined.
          snap run apiworkbench.cli --version
          snap run apiworkbench.cli --help

          cat > "$RUNNER_TEMP/snap-smoke.sh" <<'EOF'
          log="$RUNNER_TEMP/snap-smoke.log"
          snap run apiworkbench > "$log" 2>&1 &
          pid=$!
          for i in $(seq 1 120); do
            if xdotool search --name '^ApiWorkbench$' > /dev/null 2>&1 &&
               [ -n "$(find "$HOME/snap/apiworkbench" -mindepth 2 -type d -name apiworkbench)" ]; then
              echo "ApiWorkbench window is up after ${i}s; data folder:"
              find "$HOME/snap/apiworkbench" -type d -name apiworkbench
              sleep 5
              pgrep -u "$USER" -f '/snap/apiworkbench/.*/apiworkbench' > /dev/null || { echo "the snap died after showing its window"; cat "$log"; exit 1; }
              snap run --shell apiworkbench -c 'echo "running as $SNAP_NAME rev $SNAP_REVISION on $(uname -m)"'
              pkill -u "$USER" -f '/snap/apiworkbench/.*/apiworkbench' || true
              cat "$log"
              exit 0
            fi
            kill -0 "$pid" 2> /dev/null || { echo "snap run exited early"; cat "$log"; exit 1; }
            sleep 1
          done
          echo "no ApiWorkbench window and data folder after 120s"
          find "$HOME/snap/apiworkbench" -maxdepth 5
          cat "$log"
          exit 1
          EOF
          Xvfb :99 -screen 0 1280x800x24 -ac &
          export DISPLAY=:99
          sleep 2
          bash "$RUNNER_TEMP/snap-smoke.sh"

      - uses: actions/upload-artifact@v7
        with:
          name: snap-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error

  # Repackages each architecture's .deb for Fedora/RHEL/openSUSE (.rpm),
  # Arch (.pkg.tar.zst) and any glibc distribution (AppImage), then installs
  # every one of them on the real distribution and runs it there: ldd of
  # every ELF file, apiworkbench-cli, and the app under Xvfb until its window
  # and data folder appear.
  distros:
    name: Other distros ${{ matrix.arch }}
    needs: [linux]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, deb_arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, deb_arch: arm64, runner: ubuntu-24.04-arm }
    env:
      NFPM_VERSION: '2.48.0'
      APPIMAGETOOL_VERSION: '1.9.1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: linux-${{ matrix.arch }}
          path: deb

      - name: Install nfpm and appimagetool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$(uname -m)" in
            x86_64) nfpm_arch=x86_64; ai_arch=x86_64 ;;
            aarch64) nfpm_arch=arm64; ai_arch=aarch64 ;;
          esac
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          tarball="nfpm_${NFPM_VERSION}_Linux_${nfpm_arch}.tar.gz"
          gh release download "v$NFPM_VERSION" -R goreleaser/nfpm -p "$tarball" -p checksums.txt
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" nfpm
          gh release download "$APPIMAGETOOL_VERSION" -R AppImage/appimagetool \
            -p "appimagetool-$ai_arch.AppImage" -O appimagetool
          chmod +x appimagetool
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # One installed tree, the .deb's, for every format. The Flatpak job
      # gets the same cleaned tree (tar keeps modes and symlinks).
      - name: Build .rpm, Arch package and AppImage
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          dpkg-deb -x "deb/apiworkbench_${VERSION}_${{ matrix.deb_arch }}.deb" "$RUNNER_TEMP/root"
          VERSION="$VERSION" TREE_TARBALL="$RUNNER_TEMP/tree.tar.xz" \
            packaging/linux-distros/pack.sh "$RUNNER_TEMP/root" ${{ matrix.deb_arch }} dist

      # Uploaded before the distribution checks, so the Flatpak job runs
      # (and shows its own result) even when one of them fails.
      - uses: actions/upload-artifact@v7
        with:
          name: tree-${{ matrix.arch }}
          path: ${{ runner.temp }}/tree.tar.xz
          if-no-files-found: error
          retention-days: 3

      - name: Install and run on Fedora, openSUSE and Arch
        run: packaging/linux-distros/verify.sh dist ${{ matrix.deb_arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: distros-${{ matrix.arch }}
          path: |
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.AppImage
          if-no-files-found: error

  # AUR recipe: PKGBUILD + .SRCINFO for apiworkbench-bin, rendered with this
  # build's checksums and proven with makepkg on archlinux:latest.
  aur:
    name: AUR PKGBUILD
    needs: [linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: linux-*
          path: debs
          merge-multiple: true

      - name: Render and check the PKGBUILD
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          VERSION="$VERSION" packaging/arch/aur.sh \
            "debs/apiworkbench_${VERSION}_amd64.deb" "debs/apiworkbench_${VERSION}_arm64.deb" dist

      - uses: actions/upload-artifact@v7
        with:
          name: aur
          path: dist/*-aur.tar.gz
          if-no-files-found: error

  # Builds the Flatpak from the same tree, installs the bundle and runs it in
  # the sandbox: ldd of every ELF file against the GNOME runtime,
  # apiworkbench-cli, and the app under Xvfb until its window is up and Dart
  # has created its data folder.
  flatpak:
    name: Flatpak ${{ matrix.arch }}
    needs: [distros]
    if: ${{ !cancelled() && needs.distros.result != 'skipped' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, fp_arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64, fp_arch: aarch64, runner: ubuntu-24.04-arm }
    env:
      APP_ID: com.dhivalabs.api_workbench
    steps:
      - uses: actions/checkout@v7

      # A workspace path: inside a container job, runner.temp names the
      # host's directory, not the container's $RUNNER_TEMP.
      - uses: actions/download-artifact@v8
        with:
          name: tree-${{ matrix.arch }}
          path: flatpak-tree

      # The metainfo's newest <release> must be this version, or software
      # centres show a stale one.
      - name: Unpack the installed tree
        id: v
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          grep -F "<release version=\"$VERSION\"" "packaging/flatpak/$APP_ID.metainfo.xml" ||
            { echo "::error::add <release version=\"$VERSION\" .../> to packaging/flatpak/$APP_ID.metainfo.xml"; exit 1; }
          mkdir -p packaging/flatpak/tree
          tar -xJf flatpak-tree/tree.tar.xz -C packaging/flatpak/tree
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/${{ env.APP_ID }}.yml
          bundle: apiworkbench-${{ steps.v.outputs.version }}-${{ matrix.fp_arch }}.flatpak
          artifact-name: flatpak-${{ matrix.arch }}
          arch: ${{ matrix.fp_arch }}
          cache: false

      - name: Install the bundle and run it
        timeout-minutes: 10
        env:
          BUNDLE: apiworkbench-${{ steps.v.outputs.version }}-${{ matrix.fp_arch }}.flatpak
        run: |
          flatpak install -y --noninteractive --bundle "$BUNDLE"
          flatpak info "$APP_ID"
          flatpak info --show-permissions "$APP_ID"

          # Every ELF file in /app must find all of its libraries in the
          # runtime or next to it (the plugin libraries' build-machine
          # RUNPATH is replaced by the bundle's lib/, as $ORIGIN supplies it
          # at run time).
          flatpak run --command=bash "$APP_ID" -c '
            set -euo pipefail
            mapfile -d "" elfs < <(find /app -type f -print0)
            n=0; bad=0
            for f in "${elfs[@]}"; do
              [ "$(head -c 4 "$f" | od -An -tx1 | tr -d " \n")" = 7f454c46 ] || continue
              n=$((n + 1))
              if LD_LIBRARY_PATH=/app/lib/apiworkbench/lib ldd "$f" | grep "not found"; then
                echo "missing libraries for $f"; bad=1
              fi
            done
            echo "$n ELF files checked with ldd"
            [ "$bad" = 0 ] && [ "$n" -ge 5 ]
          '

          # The command-line runner, inside the sandbox.
          flatpak run --command=apiworkbench-cli "$APP_ID" --version
          flatpak run --command=apiworkbench-cli "$APP_ID" --help

          # What the optional host tools resolve to in the sandbox (Chaos
          # Mode's player, HTTP/3's curl).
          flatpak run --command=bash "$APP_ID" -c \
            'for t in which gst-play-1.0 curl; do echo "$t: $(command -v "$t" || echo missing)"; done'

          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime"
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          cat > "$RUNNER_TEMP/smoke.sh" <<'EOS'
          data="$HOME/.var/app/$APP_ID/data"
          log="$RUNNER_TEMP/flatpak-smoke.log"
          flatpak run "$APP_ID" > "$log" 2>&1 &
          pid=$!
          for i in $(seq 1 90); do
            kill -0 "$pid" 2> /dev/null || { echo "the app exited early"; cat "$log"; exit 1; }
            if python3 packaging/flatpak/x11_window.py '^ApiWorkbench$' &&
               compgen -G "$data/*/apiworkbench" > /dev/null && [ "$i" -ge 20 ]; then
              echo "still running after ${i}s; data folder:"
              compgen -G "$data/*/apiworkbench"
              kill "$pid"
              cat "$log"
              if grep -E 'error while loading shared libraries|cannot open shared object|undefined symbol' "$log"; then exit 1; fi
              exit 0
            fi
            sleep 1
          done
          echo "no ApiWorkbench window and data folder under $data after 90s"
          find "$HOME/.var/app" -maxdepth 4
          cat "$log"
          exit 1
          EOS
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash "$RUNNER_TEMP/smoke.sh"

  # Releases are made by hand, with whatever assets the maintainer attaches.
  # When one is published, this job adds the packages built above (x64 and
  # arm64) that the release does not have yet. A name that is already on the
  # release wins and is never replaced. It runs on every event so the asset
  # selection is tested on pull requests; only the upload is gated to
  # `release`.
  release:
    name: Release assets
    needs: [linux, windows, distros, aur, flatpak]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: pubspec.yaml
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          pattern: linux-*
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: windows-*
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: distros-*
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: flatpak-*
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: aur
          path: assets

      - name: Select the release assets
        id: select
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          FILES=""
          for a in "amd64 x64 x86_64" "arm64 arm64 aarch64"; do
            set -- $a
            deb="assets/apiworkbench_${VERSION}_$1.deb"
            (cd assets && sha256sum -c "$(basename "$deb").sha256")
            FILES="$FILES $deb $deb.sha256 assets/ApiWorkbench-${VERSION}-linux-$2.tar.gz assets/ApiWorkbench-${VERSION}-windows-$2.zip"
            FILES="$FILES assets/apiworkbench-${VERSION}-1.$3.rpm assets/apiworkbench-${VERSION}-1-$3.pkg.tar.zst"
            FILES="$FILES assets/ApiWorkbench-${VERSION}-$3.AppImage assets/apiworkbench-${VERSION}-$3.flatpak"
          done
          FILES="$FILES assets/apiworkbench-bin-${VERSION}-aur.tar.gz"
          ls -l assets
          ls -l $FILES
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Add the missing assets to release ${{ github.event.release.tag_name }}
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.select.outputs.version }}
          FILES: ${{ steps.select.outputs.files }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::release tag $TAG does not match pubspec.yaml version $VERSION"
            exit 1
          fi
          existing="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "already on the release:"
          echo "$existing"
          upload=()
          for f in $FILES; do
            name="$(basename "$f")"
            base="${name%.sha256}"
            # A .deb and its .sha256 go together: if either is there, skip both.
            if grep -qxF -e "$name" -e "$base" -e "$base.sha256" <<< "$existing"; then
              echo "skip $name (the release has it already)"
            else
              upload+=("$f")
            fi
          done
          if [ "${#upload[@]}" -gt 0 ]; then
            gh release upload "$TAG" "${upload[@]}" --repo "$GITHUB_REPOSITORY"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.name)\t\(.size)"'
